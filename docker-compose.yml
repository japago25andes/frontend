services:
  # Versión para usar en clase: http://localhost:8083
  web:
    build: .
    container_name: frontend-quest
    ports:
      - "8083:80"
    restart: unless-stopped

  # Versión para editar contenidos con recarga automática: http://localhost:5175
  # Se arranca con: docker compose --profile dev up dev
  dev:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      - VITE_POLLING=true
    ports:
      - "5175:5173"
    volumes:
      - .:/app
      - /app/node_modules
